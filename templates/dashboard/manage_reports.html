{% extends 'base.html' %}
{% block content %}<h2>Manage reports</h2>{% for item in items %}<div class="card p-3 mb-3"><div class="d-flex justify-content-between"><div><h5>{{ item.item_name }}</h5><p class="text-muted mb-0">{{ item.get_report_type_display }} · {{ item.category }} · {{ item.user.username }}</p></div><span class="badge bg-secondary">{{ item.status }}</span></div><form method="post" class="row g-2 mt-2">{% csrf_token %}<input type="hidden" name="report_id" value="{{ item.pk }}"><div class="col-md-3"><select class="form-select" name="action"><option value="APPROVED">Approve</option><option value="REJECTED">Reject</option><option value="RECOVERED">Recovered</option><option value="CLOSED">Close</option></select></div><div class="col-md-7"><input class="form-control" name="remarks" placeholder="Review remarks"></div><div class="col-md-2"><button class="btn btn-primary w-100">Update</button></div></form></div>{% endfor %}{% endblock %}
