{% extends 'base.html' %}
{% block content %}<h2>Manage users</h2><div class="card"><table class="table mb-0"><thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Role / status</th></tr></thead><tbody>{% for managed_user in users %}<tr><td>{{ managed_user.username }}</td><td>{{ managed_user.get_full_name|default:'-' }}</td><td>{{ managed_user.email }}</td><td><form method="post" class="d-flex gap-2">{% csrf_token %}<input type="hidden" name="user_id" value="{{ managed_user.pk }}"><select class="form-select form-select-sm" name="role"><option value="STUDENT" {% if managed_user.profile.role == 'STUDENT' %}selected{% endif %}>Student</option><option value="FACULTY" {% if managed_user.profile.role == 'FACULTY' %}selected{% endif %}>Faculty / Staff</option><option value="ADMIN" {% if managed_user.profile.role == 'ADMIN' %}selected{% endif %}>Administrator</option></select><label class="form-check mt-2"><input class="form-check-input" type="checkbox" name="is_active" {% if managed_user.is_active %}checked{% endif %}> Active</label><button class="btn btn-sm btn-primary">Save</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
