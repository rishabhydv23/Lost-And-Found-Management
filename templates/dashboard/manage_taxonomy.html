{% extends 'base.html' %}
{% block content %}<div class="row g-4"><div class="col-md-5"><div class="card p-4"><h4>Add category</h4><form method="post">{% csrf_token %}<input type="hidden" name="kind" value="category"><input class="form-control mb-2" name="name" required placeholder="Category name"><button class="btn btn-primary">Add category</button></form><hr>{% for category in categories %}<div>{{ category.name }}</div>{% endfor %}</div></div><div class="col-md-7"><div class="card p-4"><h4>Add campus location</h4><form method="post" class="row g-2">{% csrf_token %}<input type="hidden" name="kind" value="location"><div class="col-md-6"><input class="form-control" name="building" required placeholder="Building"></div><div class="col-md-6"><input class="form-control" name="block" placeholder="Block"></div><div class="col-md-6"><input class="form-control" name="floor" placeholder="Floor"></div><div class="col-md-6"><input class="form-control" name="specific_location" required placeholder="Specific location"></div><div class="col-12"><button class="btn btn-primary">Add location</button></div></form><hr>{% for location in locations %}<div>{{ location }}</div>{% endfor %}</div></div></div>{% endblock %}
