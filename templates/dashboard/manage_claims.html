{% extends 'base.html' %}
{% block content %}<h2>Manage claims</h2>{% for claim in claims %}<div class="card p-3 mb-3"><h5>{{ claim.report.item_name }} — {{ claim.claimant.username }}</h5><p>{{ claim.verification_answers }}</p>{% if claim.evidence %}<a href="{{ claim.evidence.url }}">View evidence</a>{% endif %}<form method="post" class="row g-2 mt-2">{% csrf_token %}<input type="hidden" name="claim_id" value="{{ claim.pk }}"><div class="col-md-3"><select class="form-select" name="action"><option value="APPROVED">Approve</option><option value="REJECTED">Reject</option></select></div><div class="col-md-7"><input class="form-control" name="remarks" placeholder="Admin remarks"></div><div class="col-md-2"><button class="btn btn-primary w-100">Update</button></div></form></div>{% endfor %}{% endblock %}
