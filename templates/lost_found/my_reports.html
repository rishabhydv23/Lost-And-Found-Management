{% extends 'base.html' %}
{% block content %}<div class="page-heading"><div><p class="eyebrow mb-1">Personal records</p><h2>My reports</h2></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" href="{% url 'report_found' %}">+ Found</a><a class="btn btn-primary" href="{% url 'report_lost' %}">+ Lost</a></div></div><div class="row g-3">{% for item in items %}<div class="col-md-6"><div class="card management-card"><div class="d-flex justify-content-between align-items-start"><div><h5>{{ item.item_name }}</h5><p class="text-muted mb-0">{{ item.category }} · {{ item.date_occurrence }}</p></div><span class="status-pill status-{{ item.status|lower }}">{{ item.status|title }}</span></div><div class="mt-3"><a href="{% url 'item_detail' item.pk %}" class="btn btn-sm btn-outline-primary">View</a> <a href="{% url 'edit_report' item.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></div></div></div>{% empty %}<div class="col-12"><div class="card empty-state">No reports submitted.</div></div>{% endfor %}</div>{% endblock %}
