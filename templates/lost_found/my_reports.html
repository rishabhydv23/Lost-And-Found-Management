{% extends 'base.html' %}
{% block content %}<div class="d-flex justify-content-between"><h2>My reports</h2><div><a class="btn btn-primary" href="{% url 'report_lost' %}">Lost</a> <a class="btn btn-outline-primary" href="{% url 'report_found' %}">Found</a></div></div><div class="row g-3 mt-1">{% for item in items %}<div class="col-md-6"><div class="card p-3"><div class="d-flex justify-content-between"><h5>{{ item.item_name }}</h5><span class="badge {% if item.status == 'APPROVED' %}bg-success{% elif item.status == 'PENDING' %}bg-warning text-dark{% else %}bg-secondary{% endif %}">{{ item.status }}</span></div><p class="text-muted">{{ item.category }} · {{ item.date_occurrence }}</p><a href="{% url 'item_detail' item.pk %}" class="btn btn-sm btn-outline-primary">View</a> <a href="{% url 'edit_report' item.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a></div></div>{% empty %}<p>No reports submitted.</p>{% endfor %}</div>{% endblock %}
