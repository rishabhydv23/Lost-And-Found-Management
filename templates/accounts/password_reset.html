{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password — LPU Lost & Found{% endblock %}
{% block body_class %}auth-page-body{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{% static 'images/logo.png' %}" class="auth-brand-icon" alt="LPU Lost & Found Logo">
    </div>
    <p class="eyebrow">Account recovery</p>
    <h2>Reset password</h2>
    <form method="post" style="margin-top:20px;">
      {% csrf_token %}
      <table>{{ form.as_table }}</table>
      <button class="btn btn-primary">Send Reset Instructions</button>
    </form>
  </div>
</div>
{% endblock %}
