{% extends 'base.html' %}
{% block content %}<div class="page-heading"><div><p class="eyebrow mb-1">Updates</p><h2>Notifications</h2></div></div>{% for notification in notifications %}<div class="notification-card {% if not notification.read %}unread{% endif %}"><div><strong>{{ notification.message }}</strong><br><small class="text-muted">{{ notification.created_at|date:'M d, Y H:i' }}</small></div>{% if not notification.read %}<a class="btn btn-sm btn-outline-primary" href="{% url 'mark_notification_read' notification.pk %}">Mark read</a>{% endif %}</div>{% empty %}<div class="card empty-state">No notifications.</div>{% endfor %}{% endblock %}
