{% extends 'base.html' %}
{% block content %}<h2>Notifications</h2>{% for notification in notifications %}<div class="card p-3 mb-2 {% if not notification.read %}border-start border-primary border-3{% endif %}"><div class="d-flex justify-content-between"><span>{{ notification.message }}</span>{% if not notification.read %}<a class="btn btn-sm btn-outline-primary" href="{% url 'mark_notification_read' notification.pk %}">Mark read</a>{% endif %}</div><small class="text-muted">{{ notification.created_at|date:'M d, Y H:i' }}</small></div>{% empty %}<p>No notifications.</p>{% endfor %}{% endblock %}
