{% extends 'base.html' %}
{% block content %}<div class="page-heading"><div><p class="eyebrow mb-1">Ownership verification</p><h2>Claim {{ report.item_name }}</h2></div></div><div class="col-lg-8 mx-auto"><div class="card form-card"><p class="text-muted">Provide private ownership details. Supporting information is never displayed publicly.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="mb-3"><label class="form-label">Ownership verification answers</label><textarea class="form-control" name="verification_answers" rows="5" required minlength="20"></textarea></div><div class="mb-4"><label class="form-label">Supporting evidence (optional)</label><input class="form-control" type="file" name="evidence"></div><button class="btn btn-primary">Submit claim</button></form></div></div>{% endblock %}
