{% extends 'base.html' %}
{% block content %}<div class="col-lg-7 mx-auto"><div class="card p-4"><h2>Claim {{ report.item_name }}</h2><p class="text-muted">Provide private ownership details. Never include them publicly.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="mb-3"><label class="form-label">Ownership verification answers</label><textarea class="form-control" name="verification_answers" rows="5" required minlength="20"></textarea></div><div class="mb-3"><label class="form-label">Supporting evidence (optional)</label><input class="form-control" type="file" name="evidence"></div><button class="btn btn-primary">Submit claim</button></form></div></div>{% endblock %}
